<!DOCTYPE html>
<html>
<head>
  <style>
    body { padding: 8px; overflow-y: auto; }
    .row { display: flex; align-items: center; margin-bottom: 4px; }
    .row sp-label { width: 150px; }
    .row sp-textfield { width: 72px; }
    .pad { display: flex; flex-direction: column; align-items: center; margin-top: 12px; }
    .pad > div { display: flex; }
    .middle { margin: 8px 0; }
    .gap { width: 64px; }
  </style>
</head>
<body>
  <div id="fields"></div>
  <div class="pad">
    <div><sp-button variant="primary" data-dir="up">↑</sp-button></div>
    <div class="middle">
      <sp-button variant="primary" data-dir="left">←</sp-button>
      <div class="gap"></div>
      <sp-button variant="primary" data-dir="right">→</sp-button>
    </div>
    <div><sp-button variant="primary" data-dir="down">↓</sp-button></div>
  </div>
  <script src="index.js"></script>
</body>
</html>
